<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#27ae60">
    <link rel="manifest" href="manifest.json">
    <title>당뇨 혈당 관리 매니저 PRO 2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-color: #27ae60;
            --secondary-color: #2980b9;
            --accent-color: #e67e22;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-radius: 16px;
            --status-normal: #2ecc71;
            --status-caution: #f1c40f;
            --status-danger: #e74c3c;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        [data-theme='dark'] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e2e8f0;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        [data-theme='dark'] body { background-color: var(--bg-color); }
        [data-theme='dark'] h2, [data-theme='dark'] h3 { color: #f1f5f9; }
        [data-theme='dark'] .stats-column { background: #262626; border-color: #333; }
        [data-theme='dark'] .stat-value { color: #f1f5f9; }
        [data-theme='dark'] .stat-label { color: #94a3b8; }
        
        [data-theme='dark'] input, [data-theme='dark'] select, [data-theme='dark'] textarea {
            background-color: #262626 !important;
            color: #f1f5f9 !important;
            border-color: #3f3f46 !important;
        }
        
        [data-theme='dark'] .type-btn { background: #262626; color: #94a3b8; border-color: #3f3f46; }
        [data-theme='dark'] .small-btn, [data-theme='dark'] .quick-btn { background: #262626; color: #e2e8f0; border-color: #3f3f46; }
        [data-theme='dark'] .date-header { background-color: #262626; border-color: #3f3f46; color: var(--secondary-color); }
        [data-theme='dark'] .history-item { border-bottom-color: #2d2d2d; }
        [data-theme='dark'] .memo-text { background: #2d2d2d; border-left-color: #4b5563; color: #cbd5e1; }
        [data-theme='dark'] .report-table th { background-color: #262626; color: #94a3b8; }
        [data-theme='dark'] .report-table td { border-bottom-color: #2d2d2d; color: #cbd5e1; }
        [data-theme='dark'] #hba1cBox { background: #262626 !important; }
        [data-theme='dark'] .insight-card { background: #262626; border-color: #3f3f46; }

        .theme-switch-wrapper {
            position: absolute;
            right: 1rem;
            top: 1rem;
            display: flex;
            align-items: center;
        }
        .theme-switch-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        .theme-switch-btn:active { transform: scale(0.95); }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            font-size: 16px;
        }

        header {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-color), #219150);
            color: white;
            padding: env(safe-area-inset-top) 0 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 { margin: 1rem 0 0.5rem; font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; }

        main {
            width: 100%;
            max-width: 600px;
            padding: 1rem;
            box-sizing: border-box;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 1.25rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.25rem;
            border: 1px solid rgba(0,0,0,0.03);
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 1.2rem;
            color: var(--text-color);
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gauge-container {
            width: 100%;
            height: 20px;
            background: #eee;
            border-radius: 10px;
            margin: 15px 0 5px;
            overflow: hidden;
            position: relative;
        }
        .gauge-bar {
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-in-out, background-color 0.5s;
        }
        .gauge-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .trend-indicator {
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 8px;
        }
        .trend-up { color: var(--status-danger); background: #fee2e2; }
        .trend-down { color: var(--secondary-color); background: #e3f2fd; }
        .trend-stable { color: var(--status-normal); background: #e8f5e9; }

        .stats-container {
            display: flex;
            flex-direction: row;
            gap: 12px;
            margin-bottom: 0.5rem;
        }

        @media (max-width: 380px) {
            .stats-container { flex-direction: column; }
        }

        .stats-column {
            flex: 1;
            background: #fcfcfd;
            border-radius: 12px;
            border: 1px solid #edf0f2;
            overflow: hidden;
        }

        .stat-header {
            font-size: 0.9rem;
            padding: 8px;
            text-align: center;
            margin: 0;
            color: white;
            font-weight: 700;
        }

        .stat-header.fasting { background-color: var(--status-normal); }
        .stat-header.postprandial { background-color: var(--secondary-color); }

        .stats-sub-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            padding: 12px 5px;
        }

        .stat-item { text-align: center; }
        .stat-label { font-size: 0.75rem; color: #8e9aaf; margin-bottom: 4px; }
        .stat-value { font-size: 1.1rem; font-weight: 700; color: var(--text-color); }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            margin-bottom: 1.5rem;
        }
        .quick-btn {
            padding: 10px 5px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quick-btn:active { background: var(--primary-color); color: white; transform: scale(0.95); }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 0.6rem; font-weight: 600; font-size: 0.9rem; color: #5a6a85; }

        input[type="date"], input[type="month"], input[type="time"], input[type="number"], input[type="text"], textarea, select {
            width: 100%;
            padding: 0.9rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            font-family: inherit;
            background-color: #f8fafc;
            transition: all 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.1);
        }

        .flex-row { display: flex; gap: 12px; align-items: flex-end; }
        .flex-grow-1 { flex: 1; }

        .time-adjust-btns { display: flex; gap: 4px; margin-top: 6px; }
        .adjust-btn {
            padding: 4px 8px;
            font-size: 0.7rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: #fff;
            color: #64748b;
            cursor: pointer;
        }

        .type-selector { display: flex; gap: 10px; }
        .type-btn {
            flex: 1;
            padding: 0.9rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            background: #fff;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            color: #64748b;
        }
        .type-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

        .insight-card {
            background: #f8fafc;
            border-left: 4px solid var(--secondary-color);
            padding: 1rem;
            margin-bottom: 1.25rem;
            border-radius: 0 12px 12px 0;
        }
        .insight-text { font-size: 0.9rem; line-height: 1.5; color: #475569; }

        button.submit-btn {
            width: 100%;
            padding: 1.1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.2);
            transition: all 0.2s;
        }
        button.submit-btn:active { transform: scale(0.98); box-shadow: none; }

        .chart-container { height: 260px; margin-top: 1rem; position: relative; }

        .filter-section { display: flex; gap: 8px; margin-bottom: 1rem; }
        
        @media (max-width: 480px) {
            .filter-section { flex-wrap: wrap; }
            .filter-section select, .filter-section input { flex: 1; min-width: 45%; }
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.1rem 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .date-header {
            background-color: #f8fafc;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--secondary-color);
            margin-top: 1.8rem;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            border: 1px solid #e2e8f0;
        }
        
        .date-header:first-child { margin-top: 0; }
        .history-info { flex: 1; padding-right: 10px; }
        .memo-text { font-size: 0.85rem; color: #64748b; margin-top: 6px; padding: 6px 10px; background: #f1f5f9; border-radius: 6px; border-left: 3px solid #cbd5e1; }
        .med-tag { display: inline-block; background: #fef3c7; color: #92400e; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; margin-right: 4px; font-weight: 700; }

        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }

        .level-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            color: white;
            font-size: 1.1rem;
            min-width: 50px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .bg-normal { background-color: var(--status-normal); }
        .bg-caution { background-color: var(--status-caution); }
        .bg-danger { background-color: var(--status-danger); }

        .type-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; margin-top: 6px; }
        .type-fasting { background-color: #e8f5e9; color: #2e7d32; }
        .type-postprandial { background-color: #e3f2fd; color: #1565c0; }

        .btn-delete { background: #fee2e2; border: none; color: #ef4444; width: 30px; height: 30px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn-delete:active { background: #fecaca; }
        
        .manage-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .small-btn { padding: 0.75rem; font-size: 0.9rem; border: 1.5px solid #e2e8f0; border-radius: 10px; background: white; cursor: pointer; font-weight: 600; color: #475569; transition: all 0.2s; }
        
        .report-table-wrapper { overflow-x: auto; width: 100%; border-radius: 12px; border: 1px solid #e2e8f0; }
        .report-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 300px; }
        .report-table th, .report-table td { border-bottom: 1px solid #f1f5f9; padding: 12px 10px; text-align: center; }
        .report-table th { background-color: #f8fafc; color: #64748b; font-weight: 700; }

        @media print {
            body { background-color: white; }
            header, .card:not(.report-card), footer, .no-print { display: none !important; }
            main { max-width: 100%; padding: 0; }
            .card { box-shadow: none; border: 1px solid #eee; }
            .report-card { display: block !important; width: 100%; }
        }

        footer { padding: 3rem 1rem; text-align: center; font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>
    <header>
        <div class="theme-switch-wrapper no-print">
            <button id="themeToggle" class="theme-switch-btn" onclick="toggleTheme()">🌙 다크 모드</button>
        </div>
        <h1>🩸 혈당 관리 매니저 PRO 2.0</h1>
    </header>

    <main>
        <section id="insightSection" class="insight-card no-print" style="display: none;">
            <div class="insight-text" id="insightContent">데이터를 분석 중입니다...</div>
        </section>

        <section class="card">
            <h2>📊 최근 1달 요약 <span id="trendIndicator"></span></h2>
            
            <div class="gauge-container">
                <div id="sugarGauge" class="gauge-bar bg-normal"></div>
            </div>
            <div class="gauge-labels">
                <span>저혈당(70)</span>
                <span>정상(100)</span>
                <span>주의(126)</span>
                <span>위험(200+)</span>
            </div>

            <div class="stats-container">
                <div class="stats-column">
                    <h3 class="stat-header fasting">공복</h3>
                    <div class="stats-sub-grid">
                        <div class="stat-item">
                            <div class="stat-label">평균</div>
                            <div class="stat-value" id="fAvg">-</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">최고</div>
                            <div class="stat-value" id="fMax">-</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">최저</div>
                            <div class="stat-value" id="fMin">-</div>
                        </div>
                    </div>
                </div>
                <div class="stats-column">
                    <h3 class="stat-header postprandial">식후</h3>
                    <div class="stats-sub-grid">
                        <div class="stat-item">
                            <div class="stat-label">평균</div>
                            <div class="stat-value" id="pAvg">-</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">최고</div>
                            <div class="stat-value" id="pMax">-</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">최저</div>
                            <div class="stat-value" id="pMin">-</div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="hba1cBox" style="margin-top: 15px; padding: 12px; background: #fff; border-radius: 10px; border: 1.5px dashed var(--secondary-color); text-align: center; display: block;">
                <span style="font-size: 0.9rem; color: #64748b; font-weight: 600;">🩸 최근 3달 당화혈색소(HbA1c) 예상치: </span>
                <span id="hba1cValue" style="font-size: 1.2rem; font-weight: 800; color: var(--secondary-color);">-</span>
                <span style="font-size: 1rem; font-weight: 700; color: var(--secondary-color);">%</span>
                <div style="font-size: 0.7rem; color: #94a3b8; margin: 4px 0 0;">
                    목표치: <span id="targetHbA1c">6.5</span>% 
                    <button onclick="setTargetHbA1c()" class="adjust-btn" style="padding: 2px 4px;">설정</button>
                </div>
            </div>
        </section>

        <section class="card">
            <h2>기록하기</h2>
            
            <div class="quick-actions no-print">
                <button type="button" class="quick-btn" onclick="quickFill('fasting', '기상 후')">☀️ 기상 후</button>
                <button type="button" class="quick-btn" onclick="quickFill('postprandial', '아침 식후')">🍞 조식 후</button>
                <button type="button" class="quick-btn" onclick="quickFill('postprandial', '점심 식후')">🍚 중식 후</button>
                <button type="button" class="quick-btn" onclick="quickFill('postprandial', '저녁 식후')">🍖 석식 후</button>
                <button type="button" class="quick-btn" onclick="quickFill('fasting', '취침 전')">🌙 취침 전</button>
            </div>

            <form id="bloodSugarForm">
                <div class="form-group">
                    <label for="userName">사용자 이름</label>
                    <input type="text" id="userName" placeholder="이름을 입력하세요" required>
                </div>

                <div class="form-group">
                    <label>측정 종류</label>
                    <div class="type-selector" id="typeSelector">
                        <button type="button" class="type-btn active" data-type="fasting">공복</button>
                        <button type="button" class="type-btn" data-type="postprandial">식후</button>
                    </div>
                </div>

                <div class="flex-row">
                    <div class="form-group flex-grow-1">
                        <label for="date">날짜</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group" style="flex: 1.5;">
                        <label for="time">시간</label>
                        <div>
                            <div style="display: flex; gap: 6px;">
                                <input type="time" id="time" required>
                                <button type="button" onclick="setCurrentTime()" style="padding: 0 12px; background: #64748b; color: white; border: none; border-radius: 10px; font-size: 0.8rem; font-weight: 700; white-space: nowrap;">현재</button>
                            </div>
                            <div class="time-adjust-btns">
                                <button type="button" class="adjust-btn" onclick="adjustTime(-5)">-5분</button>
                                <button type="button" class="adjust-btn" onclick="adjustTime(-10)">-10분</button>
                                <button type="button" class="adjust-btn" onclick="adjustTime(-30)">-30분</button>
                                <button type="button" class="adjust-btn" onclick="adjustTime(-60)">-1시간</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="level">혈당 수치 (mg/dL)</label>
                    <input type="number" id="level" placeholder="수치를 입력하세요" min="10" max="600" inputmode="decimal" required>
                </div>

                <div class="form-group" style="display: flex; gap: 15px; background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0;">
                    <label style="display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer;">
                        <input type="checkbox" id="medication" style="width: 18px; height: 18px;"> 💊 약 복용
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer;">
                        <input type="checkbox" id="insulin" style="width: 18px; height: 18px;"> 💉 인슐린
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; color: var(--secondary-color); font-weight: 700;">
                        <input type="checkbox" id="setAlarm" style="width: 18px; height: 18px;"> ⏰ 2시간 알람
                    </label>
                </div>

                <div class="form-group">
                    <label for="memo">메모 (식단, 운동 등)</label>
                    <textarea id="memo" rows="2" placeholder="예: 비빔밥 먹음, 30분 산책"></textarea>
                </div>

                <button type="submit" class="submit-btn">저장하기</button>
            </form>
        </section>

        <section class="card report-card">
            <h2>📑 월간 보고서</h2>
            <div class="filter-section no-print">
                <select id="reportUser" style="flex: 1;">
                    <option value="all">전체 사용자</option>
                </select>
                <input type="month" id="reportMonth" style="flex: 1;">
                <button class="small-btn" onclick="generateReport()" style="background: var(--secondary-color); color: white; border: none; padding: 0 15px;">생성</button>
            </div>
            
            <div id="reportContent" style="display: none;">
                <h3 id="reportTitle" style="text-align: center; margin: 1.5rem 0 1rem; font-size: 1.1rem;">보고서</h3>
                <div class="chart-container" style="height: 280px; margin-bottom: 1.5rem;">
                    <canvas id="monthChart"></canvas>
                </div>
                <div class="report-table-wrapper">
                    <div id="reportTableContainer"></div>
                </div>
                <button class="submit-btn no-print" onclick="window.print()" style="background: #334155; margin-top: 20px;">📄 보고서 인쇄하기 (PDF)</button>
            </div>
            <div id="reportEmpty" class="empty-state" style="text-align: center; color: #94a3b8; padding: 2rem 0; font-size: 0.9rem;">사용자와 월을 선택하고 [생성]을 눌러주세요.</div>
        </section>

        <section class="card">
            <h2>📈 최근 추이 (공복/식후 평균)</h2>
            <div class="chart-container">
                <canvas id="sugarChart"></canvas>
            </div>
        </section>

        <section class="card">
            <h2>지난 기록</h2>
            <div class="filter-section">
                <select id="filterUser" onchange="loadData()" style="flex: 1;">
                    <option value="all">전체 사용자</option>
                </select>
                <select id="filterPeriod" onchange="loadData()" style="flex: 1;">
                    <option value="all">전체 기간</option>
                    <option value="7">최근 7일</option>
                    <option value="30">최근 30일</option>
                    <option value="date">특정 날짜 선택</option>
                </select>
                <input type="text" id="searchMemo" placeholder="메모 검색..." oninput="loadData()" style="flex: 1;">
            </div>
            <div id="datePickerContainer" style="display: none; margin-bottom: 1rem;">
                <input type="date" id="filterSpecificDate" onchange="loadData()">
            </div>
            <div id="historyList" class="history-list"></div>
        </section>

        <section class="card">
            <h2>데이터 관리</h2>
            <div class="manage-btns">
                <button class="small-btn" onclick="exportData()">💾 JSON 백업</button>
                <button class="small-btn" onclick="exportCSV()">📊 엑셀 저장</button>
                <button class="small-btn" onclick="document.getElementById('importFile').click()">📂 데이터 복구</button>
            </div>
            <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
        </section>
    </main>

    <footer>
        <p>&copy; 2026 당뇨 관리 PRO 2.0. 꾸준함이 정답입니다.</p>
    </footer>

    <script>
        const API_URL = window.location.origin.includes('localhost') ? 'http://localhost:3000/sugarData' : '/sugarData';
        
        function initTheme() {
            const savedTheme = localStorage.getItem('sugarApp_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButton(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('sugarApp_theme', newTheme);
            updateThemeButton(newTheme);
        }

        function updateThemeButton(theme) {
            const btn = document.getElementById('themeToggle');
            if (btn) btn.innerText = theme === 'light' ? '🌙 다크 모드' : '☀️ 라이트 모드';
        }

        function initApp() {
            let deviceId = localStorage.getItem('sugarApp_deviceId');
            let userName = localStorage.getItem('sugarApp_userName');
            if (!deviceId) {
                deviceId = 'dev_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
                localStorage.setItem('sugarApp_deviceId', deviceId);
            }
            if (!userName) {
                userName = prompt('환영합니다! 사용하실 이름을 입력해주세요:', '홍길동') || '사용자';
                localStorage.setItem('sugarApp_userName', userName.trim());
            }
            const target = localStorage.getItem('sugarApp_targetHbA1c') || '6.5';
            document.getElementById('targetHbA1c').innerText = target;
            return { deviceId, userName: userName.trim() };
        }

        const { deviceId: DEVICE_ID, userName: USER_NAME } = initApp();
        let sugarChart = null, monthChart = null, selectedType = 'fasting', isFirstLoad = true;

        document.addEventListener('DOMContentLoaded', async () => {
            initTheme();
            document.getElementById('userName').value = USER_NAME;
            await migrateToBackend();
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            const today = new Date(now - offset).toISOString().split('T')[0];
            document.getElementById('date').value = today;
            document.getElementById('reportMonth').value = today.slice(0, 7);
            document.getElementById('filterSpecificDate').value = today;
            setCurrentTime();
            setupTypeButtons();
            await loadData();
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
        });

        async function migrateToBackend() {
            const localData = JSON.parse(localStorage.getItem('sugarData') || '[]');
            if (localData.length === 0) return;
            try {
                const response = await fetch(`${API_URL}?deviceId=${DEVICE_ID}`);
                if ((await response.json()).length === 0) {
                    for (const item of localData) {
                        delete item.id; item.deviceId = DEVICE_ID;
                        await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item) });
                    }
                    localStorage.removeItem('sugarData');
                }
            } catch (e) {}
        }

        function setCurrentTime() { document.getElementById('time').value = new Date().toTimeString().slice(0, 5); }

        function setupTypeButtons() {
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active'); selectedType = btn.dataset.type;
                });
            });
        }

        function getStatus(level, type) {
            if (type === 'fasting') {
                if (level < 100) return { label: '정상', class: 'bg-normal' };
                if (level < 126) return { label: '주의', class: 'bg-caution' };
                return { label: '위험', class: 'bg-danger' };
            } else {
                if (level < 140) return { label: '정상', class: 'bg-normal' };
                if (level < 200) return { label: '주의', class: 'bg-caution' };
                return { label: '위험', class: 'bg-danger' };
            }
        }

        document.getElementById('bloodSugarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newData = {
                deviceId: DEVICE_ID, name: document.getElementById('userName').value.trim(),
                date: document.getElementById('date').value, time: document.getElementById('time').value,
                type: selectedType, level: parseInt(document.getElementById('level').value),
                memo: document.getElementById('memo').value.trim(),
                medication: document.getElementById('medication').checked,
                insulin: document.getElementById('insulin').checked
            };

            // 1. 로컬 백업 우선 저장
            saveLocalBackup(newData);

            try {
                // 2. 서버 저장 시도
                const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(newData) });
                if (response.ok) {
                    document.getElementById('level').value = ''; document.getElementById('memo').value = '';
                    document.getElementById('medication').checked = false; document.getElementById('insulin').checked = false;
                    await loadData(); alert('안전하게 저장되었습니다. (서버+로컬)');
                }
            } catch (e) { 
                console.warn('Server save failed, but data is kept locally:', e);
                alert('네트워크 오류로 서버 저장에 실패했지만, 핸드폰에 안전하게 임시 저장되었습니다. 연결 시 자동 동기화됩니다.');
                await loadData(); 
            }
        });

        async function loadData() {
            try {
                // 앱 시작 시 자동 동기화 시도
                await syncData();

                const response = await fetch(`${API_URL}?deviceId=${DEVICE_ID}`);
                let history = await response.json();
                
                // 서버에 데이터가 없으면 로컬 데이터라도 보여줌
                if (history.length === 0) {
                    history = JSON.parse(localStorage.getItem('sugarApp_local_backup') || '[]');
                }

                history.sort((a, b) => new Date(`${b.date}T${b.time}`) - new Date(`${a.date}T${a.time}`));
                updateFilterOptions(history);
                const userFilter = document.getElementById('filterUser').value;
                let userHistory = userFilter === 'all' ? history : history.filter(d => d.name === userFilter);
                const now = new Date();
                const m1 = new Date(now); m1.setDate(now.getDate() - 30);
                const m3 = new Date(now); m3.setDate(now.getDate() - 90);
                const recentMonth = userHistory.filter(d => new Date(d.date) >= m1);
                const recent3Month = userHistory.filter(d => new Date(d.date) >= m3);
                updateStats(recentMonth, recent3Month);
                const filtered = filterData(history);
                renderHistory(filtered); renderChart(filtered);
                analyzeInsights(userHistory);
            } catch (e) {
                console.error('Load failed, showing local data:', e);
                const history = JSON.parse(localStorage.getItem('sugarApp_local_backup') || '[]');
                renderHistory(filterData(history));
            }
        }

        function saveLocalBackup(data) {
            const backup = JSON.parse(localStorage.getItem('sugarApp_local_backup') || '[]');
            // 동일한 데이터(시간/수치/타입) 중복 체크
            const isDuplicate = backup.some(d => d.date === data.date && d.time === data.time && d.level === data.level && d.type === data.type);
            if (!isDuplicate) {
                backup.push(data);
                localStorage.setItem('sugarApp_local_backup', JSON.stringify(backup));
            }
        }

        async function syncData() {
            const localData = JSON.parse(localStorage.getItem('sugarApp_local_backup') || '[]');
            if (localData.length === 0) return;

            try {
                const response = await fetch(`${API_URL}?deviceId=${DEVICE_ID}`);
                const serverData = await response.json();
                
                // 서버에 없는 데이터만 골라내기
                const toUpload = localData.filter(local => 
                    !serverData.some(server => 
                        server.date === local.date && server.time === local.time && server.level === local.level && server.type === local.type
                    )
                );

                if (toUpload.length > 0) {
                    console.log(`Syncing ${toUpload.length} items to server...`);
                    for (const item of toUpload) {
                        const { id, ...cleanItem } = item; // id가 있다면 제외
                        await fetch(API_URL, { 
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json' }, 
                            body: JSON.stringify(cleanItem) 
                        });
                    }
                }
            } catch (e) {
                console.warn('Sync failed (offline?):', e);
            }
        }

        function updateFilterOptions(data) {
            const selects = [document.getElementById('filterUser'), document.getElementById('reportUser')];
            const users = [...new Set(data.map(d => d.name))];
            selects.forEach(s => {
                const val = s.value;
                s.innerHTML = '<option value="all">전체 사용자</option>';
                users.forEach(u => { const o = document.createElement('option'); o.value = u; o.textContent = u; s.appendChild(o); });
                if (isFirstLoad && users.includes(USER_NAME)) s.value = USER_NAME;
                else s.value = users.includes(val) || val === 'all' ? val : 'all';
            });
            if (data.length > 0) isFirstLoad = false;
        }

        function filterData(data) {
            const user = document.getElementById('filterUser').value;
            const period = document.getElementById('filterPeriod').value;
            const search = document.getElementById('searchMemo').value.toLowerCase();
            document.getElementById('datePickerContainer').style.display = period === 'date' ? 'block' : 'none';
            let f = user === 'all' ? data : data.filter(d => d.name === user);
            if (period === 'date') {
                const d = document.getElementById('filterSpecificDate').value;
                if (d) f = f.filter(x => x.date === d);
            } else if (period !== 'all') {
                const l = new Date(); l.setDate(l.getDate() - parseInt(period));
                f = f.filter(x => new Date(x.date) >= l);
            }
            if (search) f = f.filter(x => x.memo.toLowerCase().includes(search));
            return f;
        }

        function updateStats(month, threeMonth) {
            const f = month.filter(d => d.type === 'fasting').map(d => d.level);
            const p = month.filter(d => d.type === 'postprandial').map(d => d.level);
            const set = (l, id) => {
                if (!l.length) { ['Avg', 'Max', 'Min'].forEach(s => document.getElementById(id + s).innerText = '-'); return; }
                const avg = Math.round(l.reduce((a, b) => a + b) / l.length);
                document.getElementById(id + 'Avg').innerText = avg;
                document.getElementById(id + 'Max').innerText = Math.max(...l);
                document.getElementById(id + 'Min').innerText = Math.min(...l);
                if (id === 'f') updateGauge(avg);
            };
            set(f, 'f'); set(p, 'p');
            const h = document.getElementById('hba1cValue');
            const lvls = threeMonth.map(d => d.level);
            if (lvls.length) {
                const avg = lvls.reduce((a, b) => a + b) / lvls.length;
                h.innerText = ((avg + 46.7) / 28.7).toFixed(1);
            } else h.innerText = '-';
            if (month.length) updateTrend(month.reduce((a,b)=>a+b.level,0)/month.length, month);
        }

        function renderHistory(data) {
            const list = document.getElementById('historyList');
            if (!data.length) { list.innerHTML = '<div style="text-align:center; padding:2rem; color:#94a3b8;">기록이 없습니다.</div>'; return; }
            const grouped = data.reduce((acc, i) => { (acc[i.date] = acc[i.date] || []).push(i); return acc; }, {});
            let html = '';
            Object.keys(grouped).sort((a, b) => new Date(b) - new Date(a)).forEach(d => {
                const items = grouped[d];
                html += `<div class="date-header"><span>📅 ${d}</span><span>평균: ${Math.round(items.reduce((s, x) => s + x.level, 0) / items.length)}</span></div>`;
                items.forEach(i => {
                    const s = getStatus(i.level, i.type);
                    html += `<div class="history-item"><div class="history-info">
                        <div style="font-weight:700; font-size:0.95rem;"><span class="status-dot ${s.class}"></span>${i.name} <span style="font-weight:400; color:#94a3b8; font-size:0.8rem;">${i.time}</span></div>
                        <div class="type-tag ${i.type === 'fasting' ? 'type-fasting' : 'type-postprandial'}">${i.type === 'fasting' ? '공복' : '식후'}</div>
                        ${i.medication ? '<span class="med-tag">💊 약</span>' : ''} ${i.insulin ? '<span class="med-tag">💉 인슐린</span>' : ''}
                        ${i.memo ? `<div class="memo-text">${i.memo}</div>` : ''}</div>
                        <div style="display:flex; align-items:center; gap:12px;"><div class="level-badge ${s.class}">${i.level}</div>
                        <button class="btn-delete" onclick="deleteRecord(${i.id})">×</button></div></div>`;
                });
            });
            list.innerHTML = html;
        }

        function renderChart(data) {
            const ctx = document.getElementById('sugarChart').getContext('2d');
            const daily = {};
            data.forEach(i => { (daily[i.date] = daily[i.date] || { f: [], p: [] })[i.type === 'fasting' ? 'f' : 'p'].push(i.level); });
            const dates = Object.keys(daily).sort().slice(-10);
            const f = dates.map(d => daily[d].f.length ? Math.round(daily[d].f.reduce((a, b) => a + b) / daily[d].f.length) : null);
            const p = dates.map(d => daily[d].p.length ? Math.round(daily[d].p.reduce((a, b) => a + b) / daily[d].p.length) : null);
            if (sugarChart) sugarChart.destroy();
            if (!dates.length) return;
            sugarChart = new Chart(ctx, {
                type: 'line',
                data: { labels: dates.map(d => d.slice(5)), datasets: [
                    { label: '공복', data: f, borderColor: '#2ecc71', backgroundColor: 'transparent', borderWidth: 3, tension: 0.3, spanGaps: true },
                    { label: '식후', data: p, borderColor: '#3498db', backgroundColor: 'transparent', borderWidth: 3, tension: 0.3, spanGaps: true }
                ]},
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { suggestedMin: 70, suggestedMax: 180 } } }
            });
        }

        async function exportCSV() {
            const res = await fetch(`${API_URL}?deviceId=${DEVICE_ID}`);
            const data = await res.json();
            if (!data.length) return alert('데이터 없음');
            let csv = '\uFEFF이름,날짜,시간,구분,혈당,상태,메모\n';
            data.forEach(d => csv += `${d.name},${d.date},${d.time},${d.type === 'fasting' ? '공복' : '식후'},${d.level},${getStatus(d.level, d.type).label},"${d.memo || ''}"\n`);
            const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
            link.download = `blood_sugar_${new Date().toISOString().split('T')[0]}.csv`; link.click();
        }

        async function exportData() {
            const res = await fetch(`${API_URL}?deviceId=${DEVICE_ID}`);
            const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([JSON.stringify(await res.json())], { type: 'application/json' }));
            link.download = `backup_${new Date().toISOString().split('T')[0]}.json`; link.click();
        }

        async function importData(e) {
            const f = e.target.files[0]; const reader = new FileReader();
            reader.onload = async (x) => {
                const data = JSON.parse(x.target.result);
                for (const i of data) { delete i.id; i.deviceId = DEVICE_ID; await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(i) }); }
                await loadData(); alert('복구 완료');
            };
            reader.readAsText(f);
        }

        window.deleteRecord = async (id) => { if (confirm('삭제?')) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); await loadData(); } };

        function quickFill(t, m) {
            document.querySelectorAll('.type-btn').forEach(b => { b.classList.remove('active'); if (b.dataset.type === t) b.classList.add('active'); });
            selectedType = t; setCurrentTime(); document.getElementById('memo').value = m + ': '; document.getElementById('level').focus();
        }

        function adjustTime(n) {
            const t = document.getElementById('time'); const [h, m] = t.value.split(':').map(Number);
            const d = new Date(); d.setHours(h, m + n); t.value = d.toTimeString().slice(0, 5);
        }

        function setTargetHbA1c() {
            const t = prompt('목표 당화혈색소(%)', document.getElementById('targetHbA1c').innerText);
            if (t && !isNaN(t)) { document.getElementById('targetHbA1c').innerText = t; localStorage.setItem('sugarApp_targetHbA1c', t); loadData(); }
        }

        function updateGauge(a) {
            const g = document.getElementById('sugarGauge'); let w = (a / 250) * 100; g.style.width = Math.min(w, 100) + '%';
            g.style.backgroundColor = a < 70 ? '#e67e22' : a < 126 ? 'var(--status-normal)' : 'var(--status-danger)';
        }

        function analyzeInsights(data) {
            if (data.length < 5) return;
            const s = document.getElementById('insightSection'); const c = document.getElementById('insightContent');
            s.style.display = 'block';
            const high = data.slice(0, 10).filter(d => (d.type === 'fasting' && d.level >= 126) || (d.type === 'postprandial' && d.level >= 200)).length;
            let m = "💡 분석: ";
            if (high >= 4) m += "최근 수치가 높습니다. 식단 조절이 필요합니다.";
            else if (high === 0) m += "아주 좋습니다! 현재 습관을 유지하세요.";
            else m += "대체로 안정적입니다.";
            const night = data.filter(d => parseInt(d.time.split(':')[0]) >= 18 && d.level >= 160).length;
            if (night >= 3) m += " 저녁 시간대 관리에 더 신경 써주세요.";
            c.innerText = m;
        }

        function updateTrend(curr, hist) {
            const i = document.getElementById('trendIndicator'); if (hist.length < 10) return;
            const prev = hist.slice(10, 20); if (!prev.length) return;
            const d = curr - (prev.reduce((a, b) => a + b.level, 0) / prev.length);
            i.innerHTML = Math.abs(d) < 5 ? '<span class="trend-indicator trend-stable">─ 안정</span>' :
                          d > 0 ? `<span class="trend-indicator trend-up">▲ 상승 (${Math.round(d)})</span>` :
                          `<span class="trend-indicator trend-down">▼ 하락 (${Math.round(Math.abs(d))})</span>`;
        }

        async function generateReport() {
            const res = await fetch(`${API_URL}?deviceId=${DEVICE_ID}`);
            const hist = await res.json();
            const u = document.getElementById('reportUser').value, m = document.getElementById('reportMonth').value;
            if (!m) return alert('월 선택');
            let f = hist.filter(x => x.date.startsWith(m)); if (u !== 'all') f = f.filter(x => x.name === u);
            const content = document.getElementById('reportContent'), empty = document.getElementById('reportEmpty');
            if (!f.length) { content.style.display = 'none'; empty.innerText = '데이터 없음'; empty.style.display = 'block'; return; }
            content.style.display = 'block'; empty.style.display = 'none';
            document.getElementById('reportTitle').innerText = `${m} 보고서 (${u === 'all' ? '전체' : u})`;
            const day = {}; f.forEach(x => { day[x.date] = day[x.date] || { f: [], p: [] }; day[x.date][x.type === 'fasting' ? 'f' : 'p'].push(x.level); });
            const dates = Object.keys(day).sort();
            const fa = dates.map(d => day[d].f.length ? Math.round(day[d].f.reduce((a, b) => a + b) / day[d].f.length) : null);
            const pa = dates.map(d => day[d].p.length ? Math.round(day[d].p.reduce((a, b) => a + b) / day[d].p.length) : null);
            renderMonthChart(dates, fa, pa);
            let h = '<table class="report-table"><thead><tr><th>날짜</th><th>공복</th><th>식후</th></tr></thead><tbody>';
            dates.forEach((d, i) => h += `<tr><td>${d.split('-')[2]}일</td><td>${fa[i] || '-'}</td><td>${pa[i] || '-'}</td></tr>`);
            document.getElementById('reportTableContainer').innerHTML = h + '</tbody></table>';
        }

        function renderMonthChart(l, f, p) {
            const ctx = document.getElementById('monthChart').getContext('2d'); if (monthChart) monthChart.destroy();
            monthChart = new Chart(ctx, {
                type: 'line', data: { labels: l.map(x => x.split('-')[2] + '일'), datasets: [
                    { label: '공복', data: f, borderColor: '#2ecc71', tension: 0.1, spanGaps: true },
                    { label: '식후', data: p, borderColor: '#3498db', tension: 0.1, spanGaps: true }
                ]}, options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>
